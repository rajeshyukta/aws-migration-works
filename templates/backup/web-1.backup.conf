# /etc/nextdp-backup/backup.conf on Web-1 (3.6.143.66). Non-secret overrides for nextdp-offsite-backup.
# Installed by scripts/web-1-vm/07-setup-offsite-backup.ps1. Secrets live in restic.env.
VM_LABEL="Web-1"
STAGE="/var/backups/web1/nightly"
HOST_TAG="web-1"
BACKUP_TAG="web-1"
PATHS=(/var/backups/web1/nightly/db /srv /etc/caddy /etc/php/8.4 /etc/cron.d /etc/systemd/system
       /etc/redis/web1-override.conf
       /root/.cconsole-hub-db-pass /root/.web1-redis-pass /root/.web1-secrets.env /root/.web1-domains-secrets.env
       /etc/nextdp-backup/README /etc/nextdp-backup/backup.conf)
EXCLUDES=(--exclude '/srv/**/writable/cache/*' --exclude '/srv/**/writable/debugbar/*' --exclude '/srv/**/writable/session/*'
          --exclude '/srv/**/storage/cache/*' --exclude '/srv/**/node_modules')
# live SQLite files are copied with sqlite3 .backup (consistent) into the stage dir; /srv still has the raw files too
SQLITE_FILES=(/srv/phpapps/daiskills.com/shared/enquiries.sqlite
              /srv/phpapps/organicgrowth.center/data/ogcen.sqlite
              /srv/phpapps/nextdigital.in/data/nextdigital.sqlite
              /srv/phpapps/proseva.org/data/proseva.sqlite)
RESTORE_TEST_DB="domains_rajesh"
RESTORE_TEST_TABLE="whois_history"
MIN_TABLES=10
