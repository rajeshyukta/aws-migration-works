<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Under Maintenance</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #111827;
        --border: #1f2937;
        --text: #f8fafc;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    main {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 28px;
      font-size: 16px;
      line-height: 1.5;
      text-align: center;
    }
    #site-host {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <span id="site-host">This site</span> is currently under maintenance. Please check back soon.
  </main>
  <script>
    (function () {
      var h = window.location && window.location.hostname;
      if (h) {
        document.getElementById("site-host").textContent = h;
        document.title = h + " — Under Maintenance";
      }
    })();
  </script>
</body>
</html>
